<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Insurance Risk Calculator API Tester</title>
</head>
<style>

body {
    background-color: white;
    color: #e62300;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
}

h1 {
    color: #e62300;
    background: none;
    font-size: 48px;
    margin-bottom: 35px;
}

p {
    color: #e62300;
    font-size: 24px;
    margin-bottom: 35px;
}

button {
    background-color: #e62300;
    color: white;
    border: none;
    padding: 25px 45px;
    margin: 10px 20px;
    font-size: 24px;
    border-radius: 10px;
    cursor: pointer;
    min-width: 280px;
}

button:hover {
    background-color: darkred;
}

button + button {
    margin-left: 30px;
}

#result {
    font-size: 22px;
    max-width: 800px;
}


h1 {
    font-weight: 900;
    -webkit-text-stroke: 1.5px black;
}

p {
    font-weight: bold;
    -webkit-text-stroke: 0.5px black;
}


</style>

<body>

    <h1>Health Insurance Risk Calculator API</h1>

    <p>This page tests the RESTful APIs provided by the Node.js server.</p>

    <div class="button-container">
    <button onclick="wakeServer()">Wake Server</button>
    <button onclick="testCalculator()">Test Calculator API</button>
	</div>

    <p id="result"></p>

    
	<script>
		const serverUrl =
			'https://healthinsurancenode-fuh2c9fja5a8heb3.centralus-01.azurewebsites.net';

		async function wakeServer() {
			try {
				const response = await fetch(serverUrl + '/api/ping');
				const data = await response.json();

				if (!response.ok) {
					throw new Error(data.message || 'Wake request failed.');
				}

				document.getElementById('result').textContent = data.message;
			} catch (error) {
				console.error('Wake Server error:', error);

				document.getElementById('result').textContent =
					'Error connecting to server: ' + error.message;
			}
		}

		async function testCalculator() {
			const result = document.getElementById('result');

			try {
				// Test blood pressure API.
				const bpResponse = await fetch(
					serverUrl + '/api/bp-category',
					{
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({
							bloodPressure: 'normal'
						})
					}
				);

				const bpData = await bpResponse.json();

				if (!bpResponse.ok) {
					throw new Error(bpData.message);
				}

				// Test BMI API.
				const bmiResponse = await fetch(
					serverUrl + '/api/bmi',
					{
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({
							heightFeet: 6,
							heightInches: 4,
							weight: 185
						})
					}
				);

				const bmiData = await bmiResponse.json();

				if (!bmiResponse.ok) {
					throw new Error(bmiData.message);
				}

				// Test overall risk API.
				const riskResponse = await fetch(
					serverUrl + '/api/risk-category',
					{
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({
							age: 20,
							bmiCategory: bmiData.category,
							bpCategory: bpData.category,
							familyHistory: []
						})
					}
				);

				const riskData = await riskResponse.json();

				if (!riskResponse.ok) {
					throw new Error(riskData.message);
				}

				result.textContent =
					'Test successful! BMI: ' + bmiData.bmi +
					', BMI category: ' + bmiData.category +
					', Risk score: ' + riskData.score +
					', Risk category: ' + riskData.category;

			} catch (error) {
				console.error('Test Calculator API error:', error);

				result.textContent =
					'Error connecting to or testing server: ' + error.message;
			}
		}
	</script>

</body>
</html>
